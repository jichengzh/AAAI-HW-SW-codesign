# TEMPLATE ONLY: this documents the complete v5 source-map shape.
# Copy it outside the repository (or to a Git-ignored location), replace every
# placeholder with an operator-approved private value, and recompute every SHA-256.
# The four input_sources shapes are documented by p6_gold176_rows.example.json,
# p6_gold176_graph_features.example.json, p6_closure.example.json, and the
# hardware-specific capability JSON example in this directory.
schema_version: p6_history_normalization_source_v5
hardware_profile: "<HARDWARE_PROFILE>"
history_root: "${P6_HISTORY_ROOT}"
asset_paths:
  training-data: "${P6_TRAINING_DATA_ROOT}"
  model-init: "${P6_MODEL_INIT_ROOT}"
  toolchain: "${P6_TOOLCHAIN_ROOT}"
input_sources:
  gold176_rows: "${P6_GOLD176_ROWS_JSON}"
  gold176_graph_features: "${P6_GOLD176_GRAPH_FEATURES_JSON}"
  capability_profiles: "${P6_CAPABILITY_PROFILES_JSON}"
  closure: "${P6_CLOSURE_JSON}"
source_contract:
  group_id: "<GROUP_ID>"
  model: pyramid
  width: ["<STAGE1_WIDTH>", "<STAGE2_WIDTH>", "<STAGE3_WIDTH>"]
  source_status: ready
  source_evidence_sha256: "<SHA256>"
  source_contract:
    schema_version: stage5_source_contract_v1
    group_id: "<GROUP_ID>"
    model: pyramid
    width: ["<STAGE1_WIDTH>", "<STAGE2_WIDTH>", "<STAGE3_WIDTH>"]
    stage_widths: ["<STAGE1_WIDTH>", "<STAGE2_WIDTH>", "<STAGE3_WIDTH>"]
    artifact_id: "<ARTIFACT_ID>"
    source_status: ready
    source_evidence_sha256: "<SHA256>"
    materialization_scope: private_hardware_execution
  source_contract_sha256: "<SHA256>"
  materialization_kind: local_pyramid_tvm
  source_evidence_kind: operator_provided
recipe_mode: procedural_profile
procedural_recipe_profile: p6_stage5_pyramid_h800_tvm_profile_v1
procedural_recipe_source:
  role_refs:
    - controller
    - source_materializer
    - performance_plan
    - finalizer
external_training_binding:
  schema_version: p6_external_training_binding_v1
  training_required: true
  training_source_kind: selected_candidate_finetune
  dataset_root: "${P6_DATASET_ROOT}"
  base_checkpoint_path: "${P6_BASE_CHECKPOINT}"
  base_checkpoint_sha256: "<SHA256>"
  pyramid_config_path: "${P6_PYRAMID_CONFIG}"
  pyramid_config_sha256: "<SHA256>"
  training_parameters:
    training_mode: finetune
    epochs: "<EPOCHS>"
    target_epoch: "<TARGET_EPOCH>"
    seed: "<TRAINING_SEED>"
    optimizer: "<OPTIMIZER>"
    learning_rate: "<LEARNING_RATE>"
    batch_size: "<TRAINING_BATCH_SIZE>"
    dataset_split: "<DATASET_SPLIT>"
    checkpoint_selection: "<CHECKPOINT_SELECTION>"
    freeze_policy: "<FREEZE_POLICY>"
    groups: "<GROUP_COUNT>"
    width_per_group: "<WIDTH_PER_GROUP>"
    base_stage_widths: ["<STAGE1_WIDTH>", "<STAGE2_WIDTH>", "<STAGE3_WIDTH>"]
execution_code_closure:
  schema_version: p6_execution_code_closure_v1
  roots:
    - closure_id: historical-chain
      source_root: "${P6_HISTORICAL_CHAIN_ROOT}"
      destination_relative_root: execution-closure/historical-chain
      sha256: "<SHA256>"
    - closure_id: adapter-dependency
      source_root: "${P6_ADAPTER_DEPENDENCY_ROOT}"
      destination_relative_root: execution-closure/adapter-dependency
      sha256: "<SHA256>"
    - closure_id: tvm-support
      source_root: "${P6_TVM_SUPPORT_ROOT}"
      destination_relative_root: execution-closure/tvm-support
      sha256: "<SHA256>"
  roles:
    stage1_scan:
      closure_id: historical-chain
      entrypoint_relative_path: "<STAGE1_SCAN_ENTRYPOINT>"
    controller:
      closure_id: historical-chain
      entrypoint_relative_path: stage5_task_round_controller_v3.sh
    source_materializer:
      closure_id: historical-chain
      entrypoint_relative_path: stage5_materialize_round_sources_v1.sh
    quantization:
      closure_id: historical-chain
      entrypoint_relative_path: "<QUANTIZATION_ENTRYPOINT>"
    performance:
      closure_id: historical-chain
      entrypoint_relative_path: stage5_build_performance_plan_v2.py
    ap:
      closure_id: historical-chain
      entrypoint_relative_path: "<AP_ENTRYPOINT>"
    finalization:
      closure_id: historical-chain
      entrypoint_relative_path: stage5_finalize_feedback_v2.py
    activation:
      closure_id: historical-chain
      entrypoint_relative_path: "<ACTIVATION_ENTRYPOINT>"
post_source_leaf_binding:
  schema_version: p6_post_source_leaf_binding_v1
  leaves:
    quant_contract:
      closure_id: historical-chain
      entrypoint_relative_path: "<QUANT_CONTRACT_LEAF>"
    performance_plan:
      closure_id: historical-chain
      entrypoint_relative_path: "<PERFORMANCE_PLAN_LEAF>"
    performance_execute:
      closure_id: historical-chain
      entrypoint_relative_path: "<PERFORMANCE_EXECUTE_LEAF>"
    ap_plan:
      closure_id: historical-chain
      entrypoint_relative_path: "<AP_PLAN_LEAF>"
    ap_execute:
      closure_id: historical-chain
      entrypoint_relative_path: "<AP_EXECUTE_LEAF>"
    feedback_finalize:
      closure_id: historical-chain
      entrypoint_relative_path: "<FEEDBACK_FINALIZE_LEAF>"
    feedback_promote:
      closure_id: historical-chain
      entrypoint_relative_path: "<FEEDBACK_PROMOTE_LEAF>"
adapter_python: "${P6_ADAPTER_PYTHON}"
adapter_dependency_closure_id: adapter-dependency
