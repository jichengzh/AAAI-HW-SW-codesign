name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[repro,dev]'
      - run: ruff check tests
      - run: >-
          ruff check framework/stage1_bridge.py framework/stage1/model_classifier.py
          framework/stage2 framework/search_three_arm.py framework/run_b4_ablation.py
          framework/run_pqs_ablation.py framework/run_pqs_codriving.py
          scripts/prepare_stage2_demo_data.py scripts/stage2_optimize_model.py
          scripts/stage2_update_evidence.py framework/stage4
          framework/stage5 scripts/reproduce/cost_model_selection.py
          scripts/reproduce/stage5_selection.py framework/stage6
          scripts/reproduce/stage6_table.py
          framework/stage7 scripts/reproduce/stage7_selection.py
          tests/stage1 tests/stage2 tests/stage4 tests/stage5 tests/stage6 tests/stage7
      - run: >-
          pytest -q tests/stage1 tests/stage2 tests/stage4
          --cov=framework.stage1_bridge --cov=framework.stage2.contracts
          --cov=framework.stage4.cost_model_selection_v1
      - name: Test Stage5 selection core with coverage
        run: |
          coverage erase
          coverage run -m pytest -q tests/stage5
          coverage report -m --include='*/framework/stage2/canonical_search_v3.py,*/framework/stage5/genome_contract_v1.py,*/framework/stage5/production_search_v1.py,*/framework/stage5/single_target_search_v2.py,*/scripts/reproduce/stage5_selection.py'
          coverage json -o stage5-coverage.json --include='*/framework/stage2/canonical_search_v3.py,*/framework/stage5/genome_contract_v1.py,*/framework/stage5/production_search_v1.py,*/framework/stage5/single_target_search_v2.py,*/scripts/reproduce/stage5_selection.py'
      - name: Enforce Stage5 per-module coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("stage5-coverage.json").read_text(encoding="utf-8"))
          expected = (
              "framework/stage2/canonical_search_v3.py",
              "framework/stage5/genome_contract_v1.py",
              "framework/stage5/production_search_v1.py",
              "framework/stage5/single_target_search_v2.py",
              "scripts/reproduce/stage5_selection.py",
          )
          for path in expected:
              percent = report["files"][path]["summary"]["percent_covered"]
              if percent < 80.0:
                  raise SystemExit(f"{path} coverage {percent:.2f}% is below 80%")
          PY
      - name: Test Stage6 paper-table selection with coverage
        run: |
          coverage erase
          coverage run -m pytest -q tests/stage6
          coverage report -m --include='*/framework/stage6/paper_table_v1.py,*/scripts/reproduce/stage6_table.py'
          coverage json -o stage6-coverage.json --include='*/framework/stage6/paper_table_v1.py,*/scripts/reproduce/stage6_table.py'
      - name: Enforce Stage6 per-module coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("stage6-coverage.json").read_text(encoding="utf-8"))
          expected = (
              "framework/stage6/paper_table_v1.py",
              "scripts/reproduce/stage6_table.py",
          )
          for path in expected:
              percent = report["files"][path]["summary"]["percent_covered"]
              if percent < 80.0:
                  raise SystemExit(f"{path} coverage {percent:.2f}% is below 80%")
          PY
      - name: Test Stage7 selection/statistics core with coverage
        run: |
          coverage erase
          coverage run -m pytest -q tests/stage7
          coverage report -m --include='*/framework/stage7/online_component_ablation_v1.py,*/framework/stage7/search_policy_v1.py,*/framework/stage7/ablation_statistics_v2.py,*/scripts/reproduce/stage7_selection.py'
          coverage json -o stage7-coverage.json --include='*/framework/stage7/online_component_ablation_v1.py,*/framework/stage7/search_policy_v1.py,*/framework/stage7/ablation_statistics_v2.py,*/scripts/reproduce/stage7_selection.py'
      - name: Enforce Stage7 per-module coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("stage7-coverage.json").read_text(encoding="utf-8"))
          expected = (
              "framework/stage7/online_component_ablation_v1.py",
              "framework/stage7/search_policy_v1.py",
              "framework/stage7/ablation_statistics_v2.py",
              "scripts/reproduce/stage7_selection.py",
          )
          for path in expected:
              percent = report["files"][path]["summary"]["percent_covered"]
              if percent < 80.0:
                  raise SystemExit(f"{path} coverage {percent:.2f}% is below 80%")
          PY
